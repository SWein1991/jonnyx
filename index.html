<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JonnyX">
<meta name="theme-color" content="#0b1026">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<title>JonnyX – Die Werwolfjagd</title>
<style>
:root{
  --bg1:#070a1c;--bg2:#141238;--panel:#151a3a;--panel2:#1d2450;--line:#2e3874;
  --gold:#f5c542;--gold2:#ffdf7a;--blue:#2b6cff;--blue2:#5aa0ff;--red:#ff4d5e;--green:#3ddc84;
  --text:#eef1ff;--muted:#a3acd6;
  --hfont:'Bangers',Impact,'Arial Black',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg1) 70%);color:var(--text);
  font-family:Nunito,system-ui,-apple-system,sans-serif;font-weight:800;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
input,textarea{-webkit-user-select:text;user-select:text}
#app{max-width:980px;margin:0 auto;padding:12px 14px 40px;min-height:100%}
h1,h2,h3{font-family:var(--hfont);letter-spacing:1.5px;font-weight:400;margin:.2em 0}
h1{font-size:44px;color:var(--gold);text-shadow:0 3px 0 #7a4b00,0 0 24px rgba(245,197,66,.35)}
h2{font-size:32px;color:var(--gold)}
h3{font-size:24px;color:var(--blue2)}
p{line-height:1.45;margin:.4em 0}
.muted{color:var(--muted);font-weight:700}
.small{font-size:14px}
button{font:inherit;cursor:pointer;border:none;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:12px 22px;border-radius:16px;
  background:var(--panel2);border:2px solid var(--line);font-size:20px;font-weight:900;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#ffd75e,#e0a812);color:#2a1a00;border-color:#fff1b8;box-shadow:0 6px 0 #8a5a00,0 0 30px rgba(245,197,66,.35)}
.btn.blue{background:linear-gradient(180deg,#4f8cff,#1f4fd1);border-color:#9cc0ff;box-shadow:0 6px 0 #0f2a78}
.btn.red{background:linear-gradient(180deg,#ff6b7a,#c81e35);border-color:#ffb3bc;box-shadow:0 6px 0 #6e0d1a}
.btn.ghost{background:transparent}
.btn.big{min-height:76px;font-size:26px;width:100%;font-family:var(--hfont);letter-spacing:1.5px;font-weight:400}
.btn:disabled{opacity:.45}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:600px){.grid4{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}h1{font-size:36px}}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--line);border-radius:22px;padding:16px;margin:12px 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:#0d1230;border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-size:18px}
.iconbtn{width:52px;height:52px;border-radius:14px;background:var(--panel2);border:2px solid var(--line);font-size:24px;display:inline-flex;align-items:center;justify-content:center}

/* ---------- Szene ---------- */
.scene{position:relative;height:300px;border-radius:24px;overflow:hidden;border:2px solid var(--line);
  background:linear-gradient(180deg,#060818 0%,#0f1240 55%,#1c1a4a 100%)}
.scene.tall{height:360px}
@media (max-width:600px){.scene{height:240px}.scene.tall{height:280px}}
.stars{position:absolute;inset:0}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.7;animation:tw 3s infinite alternate}
@keyframes tw{to{opacity:.15}}
.moon{position:absolute;right:9%;top:9%;width:70px;height:70px;border-radius:50%;
  background:radial-gradient(circle at 38% 35%,#fffbe8,#f3e3a8 60%,#d9c27a);box-shadow:0 0 50px 10px rgba(255,240,180,.35)}
.trees{position:absolute;left:0;right:0;bottom:30px;height:110px;opacity:.95}
.trees svg{width:100%;height:100%}
.ground{position:absolute;left:0;right:0;bottom:0;height:34px;background:linear-gradient(180deg,#0a0c1f,#04050d)}
.fog{position:absolute;left:-20%;right:-20%;bottom:20px;height:60px;background:radial-gradient(50% 60% at 50% 50%,rgba(180,190,255,.18),transparent 70%);animation:fog 12s ease-in-out infinite alternate}
@keyframes fog{from{transform:translateX(-6%)}to{transform:translateX(6%)}}
.hero{position:absolute;left:5%;bottom:14px;height:78%;aspect-ratio:200/260;z-index:3;animation:bob 2.2s ease-in-out infinite}
.hero .heroimg{width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center}
.hero img,.hero svg{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 0 12px var(--aura,rgba(90,160,255,.6)))}
.hero.flip img{transform:scaleX(-1)}
.hero.attack{animation:lunge .45s ease-out}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes lunge{40%{transform:translateX(18px) scale(1.04)}}
.wolf{position:absolute;right:6%;bottom:12px;height:76%;aspect-ratio:200/240;z-index:2;
  transform:translateX(calc(var(--near,0) * -70px)) scale(calc(1 + var(--near,0) * .1));transform-origin:bottom center;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.wolf.boss{height:92%;right:3%}
.wolf.alpha{height:84%}
.wolf svg{width:100%;height:100%;overflow:visible}
.wolf .inner{width:100%;height:100%;animation:sway 2.6s ease-in-out infinite;transform-origin:bottom center}
@keyframes sway{50%{transform:rotate(-2deg) translateY(-3px)}}
.wolf.enter .inner{animation:wenter .9s ease-out}
@keyframes wenter{0%{opacity:0;filter:brightness(0)}50%{opacity:1;filter:brightness(0)}100%{filter:brightness(1)}}
.wolf.hit .inner{animation:whit .45s}
@keyframes whit{0%,100%{transform:none;filter:none}20%{transform:translateX(14px) rotate(4deg);filter:brightness(3)}50%{transform:translateX(-6px)}}
.wolf.gone .inner{animation:wgone .7s forwards}
@keyframes wgone{0%{filter:brightness(3)}100%{transform:scale(.2) translateY(60px) rotate(20deg);opacity:0;filter:brightness(4)}}
.wolf.block .inner{animation:wblock .5s}
@keyframes wblock{30%{transform:scale(1.06) translateX(-8px)}}
.wolf.jump .inner{animation:wjump .45s}
@keyframes wjump{40%{transform:translateY(-30px)}}
.eyeglow{animation:eg 1.8s ease-in-out infinite}
@keyframes eg{50%{opacity:.55}}
.hpbar{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:min(70%,420px);height:22px;border-radius:12px;background:#2a0c14;border:2px solid #ff8a97;z-index:6;overflow:hidden}
.hpbar>div{height:100%;background:linear-gradient(90deg,#ff2a4a,#ff8a3d);transition:width .5s}
.hpname{position:absolute;left:50%;top:36px;transform:translateX(-50%);z-index:6;font-family:var(--hfont);font-size:22px;color:#ffb3bc;letter-spacing:1px;text-shadow:0 2px 0 #000}
.spark{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--gold2);box-shadow:0 0 10px var(--gold);z-index:7;animation:spark .8s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.popup{position:absolute;z-index:8;font-family:var(--hfont);font-size:40px;letter-spacing:2px;text-shadow:0 3px 0 #000;animation:pop 1s ease-out forwards;pointer-events:none}
@keyframes pop{0%{transform:scale(.4);opacity:0}25%{transform:scale(1.2);opacity:1}100%{transform:translateY(-50px);opacity:0}}

/* ---------- Angriffe ---------- */
.fx{position:absolute;pointer-events:none;z-index:5;--s:1}
.lv2{--s:1.3}.lv3{--s:1.65}
.fx-wasser{left:22%;top:46%;width:70px;height:26px;border-radius:50%;
  background:radial-gradient(#ffffff,#7dd3fc 45%,#0284c7 70%,transparent 72%);box-shadow:0 0 24px 6px rgba(56,189,248,.7);animation:shoot .5s ease-in forwards}
@keyframes shoot{from{left:20%;transform:scale(calc(var(--s)*.6))}to{left:70%;transform:scale(var(--s))}}
.fx-goldblitz{left:22%;top:18%;width:52%;height:55%;animation:flash .6s steps(1) forwards}
.fx-goldblitz svg{width:100%;height:100%;filter:drop-shadow(0 0 10px #ffd400) drop-shadow(0 0 20px #fff3a0)}
@keyframes flash{0%{opacity:1}15%{opacity:0}30%{opacity:1}45%{opacity:.2}60%{opacity:1}100%{opacity:0}}
.fx-flut{bottom:20px;left:-30%;width:60%;height:calc(45% * var(--s));border-radius:60% 60% 0 0;
  background:linear-gradient(180deg,rgba(255,255,255,.9),#38bdf8 30%,#0369a1);box-shadow:0 0 30px rgba(56,189,248,.8);animation:wave .75s ease-in forwards}
@keyframes wave{to{left:75%;opacity:.4}}
.fx-strudel{left:22%;top:34%;width:100px;height:100px;border-radius:50%;
  background:conic-gradient(#fde047,#38bdf8,#ffffff,#1d4ed8,#fde047);box-shadow:0 0 30px #fde047;animation:spin .7s ease-in forwards}
@keyframes spin{from{left:20%;transform:rotate(0) scale(calc(var(--s)*.5))}to{left:68%;transform:rotate(900deg) scale(var(--s))}}
.fx-tsunami{left:-100%;bottom:0;width:100%;height:calc(70% * var(--s));max-height:95%;border-radius:0 70% 0 0;
  background:linear-gradient(160deg,#fff8d0,#fbbf24 25%,#38bdf8 60%,#1e3a8a);box-shadow:0 0 50px #fbbf24;animation:tsu 1s ease-in forwards}
@keyframes tsu{to{left:100%}}

/* ---------- Kampfkarte ---------- */
.battlecard{margin-top:14px}
.de{font-size:40px;text-align:center;margin:4px 0 12px;color:#fff}
.de small{display:block;font-size:15px;color:var(--muted);font-weight:800;letter-spacing:.5px}
.answer{width:100%;height:96px;font-size:40px;font-weight:900;font-family:Nunito,system-ui,sans-serif;text-align:center;
  background:#fbfbff;color:#101433;border:4px solid var(--blue2);border-radius:20px;outline:none;padding:0 14px}
.answer:focus{border-color:var(--gold)}
.answer.small{height:80px;font-size:32px}
.fb{font-size:22px;text-align:center;margin:8px 0;padding:10px;border-radius:14px}
.fb.ok{background:rgba(61,220,132,.15);color:#8ff5bb}
.fb.half{background:rgba(245,197,66,.15);color:var(--gold2)}
.fb.bad{background:rgba(255,77,94,.15);color:#ffb3bc}
.sol{font-size:42px;text-align:center;color:#fff;margin:6px 0;display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}
.sol mark{background:var(--red);color:#fff;border-radius:6px;padding:0 4px}
.sol .gap{display:inline-block;width:6px;height:40px;background:var(--red);border-radius:3px;vertical-align:middle}
.attacks{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.att{flex:0 0 auto;min-width:92px;padding:8px 10px;border-radius:14px;background:#0d1230;border:2px solid var(--line);text-align:center;font-size:13px}
.att b{display:block;font-size:26px}
.att.sel{border-color:var(--gold);background:#2a2410;box-shadow:0 0 14px rgba(245,197,66,.4)}
.att.locked{opacity:.35}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.shield{font-size:28px;letter-spacing:2px}
.timer{font-family:var(--hfont);font-size:30px;letter-spacing:1px;color:var(--blue2);min-width:90px;text-align:center}
.timer.end{color:var(--red)}

/* ---------- Home ---------- */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{background:#0d1230;border:2px solid var(--line);border-radius:12px;padding:6px 2px;text-align:center;font-size:12px;color:var(--muted)}
.day b{display:block;font-size:16px;color:var(--text)}
.day .ic{font-size:20px;display:block;margin:2px 0}
.day.today{border-color:var(--gold);box-shadow:0 0 10px rgba(245,197,66,.35)}
.day.done{background:#13321f;border-color:#2f8a55}
.progress{height:20px;background:#0d1230;border-radius:12px;border:2px solid var(--line);overflow:hidden}
.progress>div{height:100%;background:linear-gradient(90deg,var(--blue),var(--gold));transition:width .5s}
.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:600px){.menu{grid-template-columns:1fr 1fr}}
.menu .btn{flex-direction:column;gap:2px;min-height:86px;font-size:16px}
.menu .btn span{font-size:30px}
.banner{background:rgba(255,77,94,.15);border:2px solid #8a2a36;border-radius:16px;padding:10px 14px;margin:10px 0}

/* ---------- Ritual ---------- */
.moonmeter{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:110px;height:110px;border-radius:50%;
  background:#11143a;border:3px solid #6b6f9e;overflow:hidden;z-index:4;box-shadow:0 0 30px rgba(255,240,180,.15)}
.moonmeter>div{position:absolute;left:0;right:0;bottom:0;background:radial-gradient(circle at 40% 30%,#fffbe8,#f0d98a);transition:height .6s}
.moonmeter.full{box-shadow:0 0 60px 16px rgba(255,240,180,.55)}
.moonlabel{position:absolute;left:50%;top:128px;transform:translateX(-50%);z-index:4;font-family:var(--hfont);font-size:22px;letter-spacing:1px}
.pack{position:absolute;left:3%;right:3%;bottom:16px;height:110px;display:flex;flex-wrap:wrap-reverse;align-content:flex-start;justify-content:center;gap:2px;z-index:3}
.pack .mw{height:52px;aspect-ratio:200/240}
.pack .mw.new{animation:wenter 1s ease-out}
.wordlist{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto}
.wl{display:flex;align-items:center;gap:8px;background:#0d1230;border:2px solid var(--line);border-radius:12px;padding:8px 10px;font-size:18px}
.wl .x{margin-left:auto}
.lbl{font-size:15px;color:var(--muted);margin:10px 0 4px;display:block}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;background:rgba(3,4,14,.82);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.modal .box{background:linear-gradient(180deg,#232b5e,#141a3d);border:3px solid var(--gold);border-radius:26px;padding:22px;max-width:620px;width:100%;max-height:90vh;overflow:auto;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2a2410;border:2px solid var(--gold);color:var(--gold2);
  padding:12px 20px;border-radius:16px;z-index:60;font-size:18px;animation:fade .2s;max-width:90vw;text-align:center}
.breath{width:180px;height:180px;margin:20px auto;border-radius:50%;background:radial-gradient(circle,#7dd3fc,#1d4ed8);box-shadow:0 0 60px rgba(90,160,255,.6);animation:breath 8s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(.55)}50%{transform:scale(1)}}

/* ---------- Shop / Pokale ---------- */
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.item{background:#0d1230;border:2px solid var(--line);border-radius:18px;padding:12px;text-align:center}
.item.on{border-color:var(--gold)}
.item .ico{font-size:44px}
.item .prev{height:130px;display:flex;justify-content:center}
.item .prev .heroimg{height:100%;aspect-ratio:200/260}
.item .prev img,.item .prev svg{height:100%;width:auto;filter:drop-shadow(0 0 10px var(--aura,transparent))}
.tabs{display:flex;gap:8px;margin:10px 0}
.tabs .btn{flex:1}
.tabs .btn.on{border-color:var(--gold);color:var(--gold)}
.trophy{display:flex;align-items:center;gap:12px;background:#0d1230;border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin:8px 0;font-size:18px}
.trophy .t{font-size:36px;filter:grayscale(1);opacity:.35}
.trophy.got{border-color:var(--gold)}
.trophy.got .t{filter:none;opacity:1}

/* ---------- Eltern ---------- */
.pin{display:flex;justify-content:center;gap:14px;margin:16px 0}
.pin i{width:22px;height:22px;border-radius:50%;border:3px solid var(--gold);display:block}
.pin i.f{background:var(--gold)}
.keypad{display:grid;grid-template-columns:repeat(3,84px);gap:10px;justify-content:center}
.keypad .btn{font-size:28px;min-height:70px;padding:0}
table{width:100%;border-collapse:collapse;font-size:16px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:800}
.edit{width:100%;font:inherit;font-size:17px;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:#0d1230;color:#fff}
textarea.edit{height:120px;font-family:monospace;font-size:13px}
.checker{background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/20px 20px;border-radius:16px;height:240px;display:flex;justify-content:center;align-items:center;margin:10px 0}
.checker img{max-height:220px;max-width:90%}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* =====================================================================
   JonnyX – Die Werwolfjagd. Vokabel-Trainer (Deutsch -> Englisch)
   Alle Daten liegen lokal im Browser (localStorage).
   ===================================================================== */

/* ---------- Helfer ---------- */
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dkey(d = new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const today = () => dkey();
function pdate(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(k,n){const d=pdate(k);d.setDate(d.getDate()+n);return dkey(d)}
function daysBetween(a,b){return Math.round((pdate(b)-pdate(a))/864e5)}
const shuffle = a => {a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const uidGen = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const coarse = matchMedia('(pointer:coarse)').matches;

/* ---------- Spielwelt-Daten ---------- */
const REGIONS = [
  {name:'Das Dorf',        boss:'Grauzahn',     wolf:'Dorf-Werwolf',     fur:'#3b3444', eye:'#ffcc33'},
  {name:'Der dunkle Wald', boss:'Nachtkralle',  wolf:'Schatten-Werwolf', fur:'#1d1b2c', eye:'#c45bff'},
  {name:'Das Nebelmoor',   boss:'Moorfang',     wolf:'Moor-Werwolf',     fur:'#2f3b2d', eye:'#a6ff4d'},
  {name:'Die Wolfsberge',  boss:'Felsbrecher',  wolf:'Berg-Werwolf',     fur:'#4a4038', eye:'#ff8a33'},
  {name:'Die Burgruine',   boss:'Blutmond',     wolf:'Burg-Werwolf',     fur:'#3a2a2c', eye:'#ff3b4e'},
  {name:'Der Mondsee',     boss:'Silberheuler', wolf:'Mond-Werwolf',     fur:'#3d4a66', eye:'#d6ecff'},
  {name:'Die Schattenschlucht', boss:'Schattenmaul', wolf:'Schlucht-Werwolf', fur:'#22262f', eye:'#ff4dd6'},
  {name:'Der Eisgipfel',   boss:'Frostfang',    wolf:'Eis-Werwolf',      fur:'#8fa8bf', eye:'#33e6ff'},
];
const ATTACKS = [
  {id:'wasser',    name:'Wasserstrahl',  icon:'💧', unlock:'Von Anfang an',         ok:()=>true},
  {id:'goldblitz', name:'Goldblitz',     icon:'⚡', unlock:'3 Lerntage',            ok:()=>learnDays()>=3},
  {id:'flut',      name:'Flutwelle',     icon:'🌊', unlock:'50 besiegte Werwölfe',  ok:()=>S.defeated>=50},
  {id:'strudel',   name:'Donnerstrudel', icon:'🌀', unlock:'Ersten Boss besiegt',   ok:()=>S.bosses.some(b=>b.won)},
  {id:'tsunami',   name:'Gold-Tsunami',  icon:'🔱', unlock:'2 Wochen dabei',        ok:()=>daysBetween(S.created,today())>=14},
];
const UPGRADE_COST = {1:30, 2:60};
const SUITS = [
  {id:'classic', name:'Goldrüstung',      cost:0,   filter:'none',                                              aura:'rgba(255,210,80,.6)'},
  {id:'nacht',   name:'Nacht-Rüstung',  cost:40,  filter:'brightness(.72) saturate(1.4) hue-rotate(15deg)',     aura:'rgba(140,90,255,.7)'},
  {id:'eis',     name:'Eis-Rüstung',      cost:60,  filter:'hue-rotate(-25deg) saturate(.75) brightness(1.25)',   aura:'rgba(160,240,255,.8)'},
  {id:'gold',    name:'Sonnenrüstung',   cost:80,  filter:'sepia(.85) saturate(2.4) hue-rotate(-8deg) brightness(1.08)', aura:'rgba(255,210,60,.85)'},
  {id:'sturm',   name:'Sturm-Rüstung',    cost:110, filter:'hue-rotate(70deg) saturate(1.5)',                    aura:'rgba(120,255,200,.7)'},

function norm(s){return String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/\s+/g,' ').trim().replace(/[.!?]+$/,'')}
function variants(en){return String(en).split(/\s*[\/;]\s*/).map(norm).filter(Boolean)}
function osa(a,b){ // Editierabstand inkl. vertauschter Buchstaben
  const m=a.length,n=b.length,d=[];
  for(let i=0;i<=m;i++){d[i]=[i]}
  for(let j=0;j<=n;j++){d[0][j]=j}
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){
    const c=a[i-1]===b[j-1]?0:1;
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);
  }
  return d[m][n];
}
function check(answer, en){
  const a=norm(answer); const vs=variants(en);
  if(!a) return {score:0, target:vs[0]||en};
  let best=99,target=vs[0];
  for(const v of vs){const d=osa(a,v); if(d<best){best=d;target=v}}
  if(best===0) return {score:1,target};
  if(best===1 && target.length>=3) return {score:.5,target};
  return {score:0,target};
}
function diffHTML(ans,target){ // markiert die eine falsche Stelle
  const a=norm(ans),t=target; let p=0;
  while(p<a.length&&p<t.length&&a[p]===t[p])p++;
  let s=0;
  while(s<a.length-p&&s<t.length-p&&a[a.length-1-s]===t[t.length-1-s])s++;
  const mid=t.slice(p,t.length-s);
  return esc(t.slice(0,p))+(mid?`<mark>${esc(mid)}</mark>`:'<span class="gap"></span>')+esc(t.slice(t.length-s));
}
function gradeOf(p){return p>=.92?1:p>=.81?2:p>=.67?3:p>=.5?4:p>=.3?5:6}

}

let AC=null;
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}
  if(AC.state==='suspended') AC.resume().catch(()=>{});
  return AC;
}
function tone({type='sine',f0=440,f1=null,dur=.3,vol=.15,delay=0,vib=0}){
  const a=ac(); if(!a||S.muted) return; const t=a.currentTime+delay;
  const o=a.createOscillator(),g=a.createGain(); o.type=type; o.frequency.setValueAtTime(f0,t);
  if(f1) o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  if(vib){const l=a.createOscillator(),lg=a.createGain(); l.frequency.value=vib; lg.gain.value=f0*.05; l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t+dur+.05)}
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.03); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.05);
}
function noise({dur=.3,vol=.2,delay=0,freq=1000,q=1}){
  const a=ac(); if(!a||S.muted) return; const t=a.currentTime+delay;
  const b=a.createBuffer(1,Math.max(1,a.sampleRate*dur|0),a.sampleRate); const ch=b.getChannelData(0);
  for(let i=0;i<ch.length;i++) ch[i]=Math.random()*2-1;
  const s=a.createBufferSource(); s.buffer=b; const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=q;
  const g=a.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(a.destination); s.start(t); s.stop(t+dur+.05);
}

function suitOf(id){return SUITS.find(s=>s.id===id)||SUITS[0]}
function heroInner(suitId=S.suit){
  const s=suitOf(suitId);
  return `<div class="heroimg" style="filter:${s.filter};--aura:${s.aura}"><img src="${S.hero||JONNY_IMG}" alt="JonnyX" style="${S.heroFlip?'transform:scaleX(-1)':''}"></div>`;
}
let STARS='';
for(let i=0;i<40;i++) STARS+=`<i class="star" style="left:${Math.random()*100}%;top:${Math.random()*55}%;animation-delay:${(Math.random()*3).toFixed(1)}s"></i>`;
function treesSVG(){
  let p='';
  for(let i=0;i<22;i++){const x=i*19+Math.random()*8-4, h=50+Math.random()*48, w=12+Math.random()*7;
    p+=`<path d="M${x} 100 L${x+w} ${100-h*.4} L${x+w*.55} ${100-h*.4} L${x+w*.9} ${100-h*.7} L${x+w*.5} ${100-h*.7} L${x+w*.75} ${100-h} L${x} ${100-h*1.05} L${x-w*.75} ${100-h} L${x-w*.5} ${100-h*.7} L${x-w*.9} ${100-h*.7} L${x-w*.55} ${100-h*.4} L${x-w} ${100-h*.4}Z"/>`}
  return `<svg viewBox="0 0 400 100" preserveAspectRatio="none"><g fill="#070915">${p}</g></svg>`;
}
const TREES = treesSVG();
function sceneHTML({wolf='',extra='',tall=false,moon=true}={}){
  return `<div class="scene ${tall?'tall':''}" id="scene">
    <div class="stars">${STARS}</div>${moon?'<div class="moon"></div>':''}
    <div class="trees">${TREES}</div><div class="fog"></div><div class="ground"></div>
    <div class="hero" id="hero">${heroInner()}</div>${wolf}${extra}</div>`;
}

/* ---------- UI-Helfer ---------- */
function toast(msg,ms=2600){const t=document.createElement('div');t.className='toast';t.innerHTML=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
function modal(html){closeModal();const m=document.createElement('div');m.className='modal';m.id='modal';m.innerHTML=`<div class="box">${html}</div>`;document.body.appendChild(m);return m}
function closeModal(){$('#modal')?.remove()}
function sparks(x,y,n=12,color){
  const sc=$('#scene'); if(!sc) return;
  for(let i=0;i<n;i++){const s=document.createElement('i');s.className='spark';const a=Math.random()*Math.PI*2,r=40+Math.random()*70;
    s.style.left=x+'%';s.style.top=y+'%';s.style.setProperty('--dx',Math.cos(a)*r+'px');s.style.setProperty('--dy',Math.sin(a)*r+'px');
    if(color){s.style.background=color;s.style.boxShadow='0 0 10px '+color}
    sc.appendChild(s);setTimeout(()=>s.remove(),900)}
}
function popText(txt,color,x=60,y=30){const sc=$('#scene');if(!sc)return;const p=document.createElement('div');p.className='popup';p.textContent=txt;p.style.color=color;p.style.left=x+'%';p.style.top=y+'%';sc.appendChild(p);setTimeout(()=>p.remove(),1100)}
function setWolfClass(c,ms=500){const w=$('#wolf');if(!w)return;w.classList.remove('hit','gone','enter','block','jump');void w.offsetWidth;w.classList.add(c);if(ms)setTimeout(()=>w.classList.remove(c),ms)}
function fireAttack(onHit){
  const sc=$('#scene'); if(!sc) return; const id=S.selAttack, lv=S.attackLv[id]||1;
  const el=document.createElement('div'); el.className=`fx fx-${id} lv${lv}`;
  if(id==='goldblitz') el.innerHTML=`<svg viewBox="0 0 300 120" preserveAspectRatio="none"><polyline points="0,60 40,30 70,70 110,20 150,80 190,25 230,75 270,35 300,60" fill="none" stroke="#fff6b0" stroke-width="${6*lv}"/><polyline points="0,60 40,30 70,70 110,20 150,80 190,25 230,75 270,35 300,60" fill="none" stroke="#ffd400" stroke-width="${2.5*lv}"/></svg>`;
  sc.appendChild(el); const h=$('#hero'); h?.classList.remove('attack'); void h?.offsetWidth; h?.classList.add('attack');
  (sfx[id]||sfx.wasser)();
  setTimeout(()=>{onHit&&onHit()}, id==='tsunami'?650:id==='flut'?500:420);
  setTimeout(()=>el.remove(),1100);
}
function attackBar(){
  return `<div class="attacks">${ATTACKS.map(a=>{const ok=a.ok();const lv=S.attackLv[a.id]||1;
    return `<button class="att ${S.selAttack===a.id?'sel':''} ${ok?'':'locked'}" data-a="selatt" data-id="${a.id}" ${ok?'':'disabled'}><b>${ok?a.icon:'🔒'}</b>${a.name}${ok&&lv>1?` · St. ${lv}`:''}</button>`}).join('')}</div>`;
}
const inputAttrs = 'autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"';
function checkUnlocks(){ // neue Attacken & Pokale melden
  const msgs=[];
  for(const a of ATTACKS){ if(a.ok() && !S.seenAttacks.includes(a.id)){S.seenAttacks.push(a.id); msgs.push(`${a.icon} Neue Attacke: <b>${a.name}</b>!`)} }
  S.bestStreak=Math.max(S.bestStreak,streak());
  for(const t of TROPHIES){ if(t.ok() && !S.trophies.includes(t.id)){S.trophies.push(t.id); msgs.push(`${t.icon} Pokal: <b>${t.name}</b>`)} }
  save(); return msgs;
}

let screen='home', P={}, T=null, B=null, R=null, parentOK=false;
function go(s,p={}){screen=s;P=p;if(T&&s!=='hunt'){clearInterval(T.iv);T=null}render();window.scrollTo(0,0)}
function render(){
  const f={home,ritual,hunt:huntScreen,bossIntro,boss:bossScreen,shop,trophies,heroScreen,parents}[screen]||home;
  app.innerHTML=f();
  after[screen]?.();
}
const after={};

function home(){
  const cw=curWeek(), reg=region(cw), ww=weekWords(cw), learned=ww.filter(w=>w.box>=2).length;
  const t=today(), wd=new Date().getDay(), rec=S.days[t], st=streak();
  const ritualDue = !cw || (wd===4 && cw.start!==t);
  const lastBoss=[...S.bosses].reverse().find(b=>cw&&b.week===cw.id);
  const extra = lastBoss && lastBoss.grade>2 && !rec?.extra && ww.length;
  const monday=new Date(); monday.setDate(monday.getDate()-((wd+6)%7));
  const PLAN={1:['⚔️',`${S.settings.short} Min`],2:['👹',`${S.settings.long} Min`],3:['👹',`${S.settings.short} Min`],4:['🌕','Ritual'],5:['⚔️',`${S.settings.long} Min`],6:['💤','frei'],0:['💤','frei']};
  let days='';
  for(let i=0;i<7;i++){const d=new Date(monday);d.setDate(d.getDate()+i);const k=dkey(d),w=d.getDay(),done=S.days[k]?.done;
    days+=`<div class="day ${k===t?'today':''} ${done?'done':''}"><b>${WD[w]}</b><span class="ic">${done?'✅':PLAN[w][0]}</span>${PLAN[w][1]}</div>`}
  let main='';
  if(ritualDue) main=`<button class="btn primary big" data-a="go" data-s="ritual">🌕 ${cw?'Rudel-Ritual: neue Wörter':'Erstes Rudel rufen'}</button>`;
  else main=`<button class="btn primary big" data-a="hunt">⚔️ ${rec?.done?'Noch eine Jagd':'Jagd starten'} · ${roundMins()} Min${isWeekend()?' · doppelte Zähne':''}</button>`;
  return `
  ${!storageOK?'<div class="banner">⚠️ Speichern klappt in diesem Browser gerade nicht. Fortschritt geht beim Schließen verloren.</div>':''}
  <div class="top"><h1>JonnyX</h1>
    <div class="row"><span class="pill">🦷 ${S.teeth}</span><span class="pill">🔥 ${st}</span>
    <button class="iconbtn" data-a="mute">${S.muted?'🔇':'🔊'}</button></div></div>
  ${sceneHTML({wolf: cw?`<div class="wolf ${ww.length?'':'gone'}" id="wolf"><div class="inner">${wolfSVG(reg)}</div></div>`:''})}
  <div class="card">
    ${cw?`<div class="row" style="justify-content:space-between"><h3>${esc(reg.name)}</h3><span class="muted">Boss: ${esc(reg.boss)}</span></div>

/* ======================= JAGD ======================= */
function huntQueue(){
  const cw=curWeek(), t=today();
  return S.words.filter(w=>w.week===cw.id||w.due<=t)
    .map(w=>({id:w.id,s:(w.alpha?0:6)+w.box*2+(w.week===cw.id?0:4)+Math.random()*3}))
    .sort((a,b)=>a.s-b.s).map(x=>x.id);
}
function extraQueue(){
  const cw=curWeek(); let ws=S.words.filter(w=>w.alpha||(w.week===cw.id&&w.box<=1));
  if(!ws.length) ws=weekWords(cw);
  return shuffle(ws).map(w=>w.id);
}
function startHunt(mode){
  if(!curWeek()||!S.words.length){toast('Erst ein Rudel rufen!');return}
  const q=mode==='extra'?extraQueue():huntQueue();
  if(!q.length){toast('Gerade sind keine Werwölfe da! 🎉');return}
  const mins=mode==='extra'?5:roundMins();
  T={mode,queue:q,pos:0,misses:{},cracks:0,start:Date.now(),limit:mins*60000,timeUp:false,right:0,half:0,wrong:0,teeth:0,beaten:0,errors:new Set(),phase:'ask',cur:null,iv:null,before:ATTACKS.filter(a=>a.ok()).map(a=>a.id)};
  screen='hunt'; render(); nextWord();
  T.iv=setInterval(tick,1000);
}
function tick(){
  if(!T) return; const left=T.limit-(Date.now()-T.start);
  if(left<=0&&!T.timeUp){T.timeUp=true}
  const el=$('#timer'); if(el){const s=Math.max(0,Math.ceil(left/1000));el.textContent=T.timeUp?'Letzter!':`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;el.classList.toggle('end',left<30000)}
}
function huntScreen(){
  return `<div class="hud"><button class="iconbtn" data-a="hquit">✕</button>
    <span class="shield" id="shield"></span><span class="timer" id="timer">–</span>
    <span class="pill">🐺 <span id="beaten">0</span> · 🦷 <span id="hteeth">0</span></span></div>
  ${sceneHTML({wolf:`<div class="wolf" id="wolf"><div class="inner" id="wolfinner"></div></div>`})}
  <div class="card battlecard" id="bcard"></div>`;
}
function hud(){
  if(!T) return;
  $('#shield').textContent='💠'.repeat(3-T.cracks)+'💔'.repeat(T.cracks);
  $('#beaten').textContent=T.beaten; $('#hteeth').textContent=T.teeth;
}
function nextWord(){
  if(!T) return;
  if(T.timeUp) return endHunt('time');
  if(T.pos>=T.queue.length) return endHunt('clear');
  const w=S.words.find(x=>x.id===T.queue[T.pos]);
  if(!w){T.pos++;return nextWord()}
  T.cur=w; T.phase='ask';
  const wk=S.weeks.find(x=>x.id===w.week); const reg=region(wk);
  const wolf=$('#wolf'); wolf.className='wolf'+(w.alpha?' alpha':''); wolf.style.setProperty('--near',T.misses[w.id]||0);
  $('#wolfinner').innerHTML=wolfSVG(reg,{alpha:w.alpha});
  setWolfClass('enter',900); sfx.growl();
  askCard(w); hud(); tick();
}
function askCard(w){
  $('#bcard').innerHTML=`${attackBar()}
    <div class="de"><small>${w.alpha?'🔴 ALPHA-WERWOLF · ':''}Was heißt auf Englisch?</small>${esc(w.de)}</div>
    <input class="answer" id="ans" lang="en" ${inputAttrs} placeholder="Hier mit dem Stift schreiben">

}
function huntSubmit(){
  if(!T||T.phase!=='ask') return; const w=T.cur; const val=$('#ans').value;
  if(!val.trim()){toast('Schreib erst eine Antwort ✍️');return}
  T.phase='busy'; const r=check(val,w.en); const missed=T.misses[w.id]||0;
  if(r.score===1){
    fireAttack(()=>{setWolfClass('gone',0);sparks(78,50,14);popText('TREFFER!','#ffd75e')});
    onRight(w,missed===0);
    let g=1+((S.attackLv[S.selAttack]||1)>=3?1:0); if(isWeekend()&&T.mode!=='extra') g*=2;
    T.teeth+=g; S.teeth+=g; S.defeated++; T.beaten++; T.right++; save();
    $('#bcard').innerHTML=`<div class="fb ok">💥 Werwolf besiegt! <b>${esc(w.de)}</b> = <b>${esc(r.target)}</b> · +${g} 🦷</div>`;
    setTimeout(()=>speak(r.target),300);
    setTimeout(()=>{T&&(T.pos++,nextWord())},1500);
  } else if(r.score===.5){
    fireAttack(()=>{setWolfClass('hit');sparks(78,50,6);popText('FAST!','#ffd75e')}); sfx.half();
    onHalf(w); T.half++; reinsert(w.id); save();
    $('#bcard').innerHTML=`<div class="fb half">Fast! Ein Buchstabe stimmt nicht. Der Werwolf ist verletzt und flieht, er kommt aber gleich wieder.</div>
      <div class="sol"><span>${diffHTML(val,r.target)}</span><button class="iconbtn" data-a="say" data-t="${esc(r.target)}">🔊</button></div>
      <button class="btn primary big" data-a="hnext">Weiter</button>`;
    speak(r.target);
  } else {
    T.misses[w.id]=missed+1; T.wrong++; T.errors.add(w.id); onWrong(w); save();
    const wolf=$('#wolf'); wolf.style.setProperty('--near',Math.min(3,T.misses[w.id])); setWolfClass('jump'); sfx.growl();
    if(T.misses[w.id]>=3){
      T.cracks++; sfx.crack(); hud(); popText('RISS!','#ff4d5e',20,30);
      $('#bcard').innerHTML=`<div class="fb bad">💔 Der Werwolf hat dich erwischt! Dein Wasserschild hat einen Riss.</div>
        <div class="sol">${esc(w.de)} = <b>${esc(variants(w.en)[0]||w.en)}</b><button class="iconbtn" data-a="say" data-t="${esc(w.en)}">🔊</button></div>
        <p class="muted" style="text-align:center">Dieser Alpha-Werwolf kommt morgen wieder.</p>
        <button class="btn primary big" data-a="hnext">${T.cracks>=3?'Rückzug…':'Weiter'}</button>`;
      speak(w.en);
      if(T.cracks>=3) T.retreat=true;
    } else {
      T.phase='copy'; reinsert(w.id);
      $('#bcard').innerHTML=`<div class="fb bad">🐺 Der Werwolf springt näher! So heißt es richtig:</div>
        <div class="sol"><b>${esc(variants(w.en)[0]||w.en)}</b><button class="iconbtn" data-a="say" data-t="${esc(w.en)}">🔊</button></div>
        <label class="lbl" style="text-align:center">Schreib es einmal ab, dann weicht er zurück:</label>
        <input class="answer small" id="copy" lang="en" ${inputAttrs}>
        <button class="btn blue big" style="margin-top:12px" data-a="hcopy">🛡️ Zurückdrängen</button>`;
      const c=$('#copy'); c.addEventListener('keydown',e=>{if(e.key==='Enter')act('hcopy')}); if(!coarse)c.focus();
      speak(w.en); T.copyTries=0;
    }
  }
  hud();
}
function huntCopy(){
  if(!T||T.phase!=='copy') return; const w=T.cur; const v=$('#copy').value;
  if(check(v,w.en).score===1||++T.copyTries>=3){
    T.phase='busy'; fireAttack(()=>{setWolfClass('hit');const wolf=$('#wolf');wolf.style.setProperty('--near',0)});
    $('#bcard').innerHTML=`<div class="fb half">Zurückgedrängt! Er kommt später in dieser Runde noch mal.</div>`;
    setTimeout(()=>{T&&(T.pos++,nextWord())},1300);
  } else { toast('Noch nicht ganz, schau genau hin 👀'); $('#copy').value=''; }
}
function reinsert(id){const at=Math.min(T.queue.length,T.pos+4);T.queue.splice(at,0,id)}
function huntNext(){if(!T)return; if(T.retreat) return endHunt('retreat'); T.pos++; nextWord()}
function endHunt(reason){
  if(!T) return; clearInterval(T.iv);
  const mins=(Date.now()-T.start)/60000; const rec=dayRec(); rec.mins=Math.round(((rec.mins||0)+mins)*10)/10;
  if(reason!=='quit'||mins>=3) rec.done=true;
  if(T.mode==='extra') rec.extra=true;
  const msgs=checkUnlocks(); save();
  const errs=[...T.errors].map(id=>S.words.find(w=>w.id===id)).filter(Boolean);
  const title={time:'Zeit um, gut gekämpft!',clear:'Alle Werwölfe besiegt! 🎉',retreat:'JonnyX zieht sich zurück',quit:'Jagd beendet'}[reason];
  if(reason==='clear'||reason==='time') sfx.win();
  const t=T; T=null;
  modal(`<h2>${title}</h2>
    ${reason==='retreat'?'<p>Dein Schild hat drei Risse. Morgen ist er wieder heil, und die schweren Werwölfe kommen wieder.</p>':''}
    <div class="grid2" style="margin:12px 0"><div class="card"><h1>${t.beaten}</h1>Werwölfe besiegt</div><div class="card"><h1>+${t.teeth}</h1>Zähne 🦷</div></div>

    ${msgs.map(m=>`<p style="font-size:20px">${m}</p>`).join('')}
    <button class="btn primary big" style="margin-top:12px" data-a="closego">Zurück ins Dorf</button>`);
}

}

after.heroScreen=()=>{$('#herofile').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f) return; $('#heroprev').innerHTML='<p class="muted">Schneide aus…</p>';
  try{const url=await processDrawing(f); P.pending=url;
    $('#heroprev').innerHTML=`<div class="checker"><img src="${url}" alt="Vorschau"></div><div class="grid2"><button class="btn primary" data-a="herook">✅ Übernehmen</button><button class="btn" data-a="go" data-s="heroScreen">Nochmal</button></div>`;
  }catch(err){$('#heroprev').innerHTML='<p class="muted">Das Bild konnte nicht gelesen werden. Versuch ein anderes.</p>'}
})};
function processDrawing(file){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{try{
      let w=img.naturalWidth,h=img.naturalHeight; const sc=Math.min(1,1000/Math.max(w,h)); w=Math.round(w*sc); h=Math.round(h*sc);
      const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.drawImage(img,0,0,w,h);
      const d=x.getImageData(0,0,w,h), p=d.data;
      // Hintergrundfarbe aus dem Rand schätzen (Median)
      const rs=[],gs=[],bs=[]; const push=i=>{rs.push(p[i]);gs.push(p[i+1]);bs.push(p[i+2])};
      for(let X=0;X<w;X+=4){push((0*w+X)*4);push(((h-1)*w+X)*4)} for(let Y=0;Y<h;Y+=4){push((Y*w)*4);push((Y*w+w-1)*4)}
      const med=a=>a.sort((m,n)=>m-n)[a.length>>1]; const br=med(rs),bg=med(gs),bb=med(bs);
      let minX=w,minY=h,maxX=-1,maxY=-1;
      for(let i=0;i<p.length;i+=4){
        const dist=Math.hypot(p[i]-br,p[i+1]-bg,p[i+2]-bb);
        if(dist<38) p[i+3]=0; else if(dist<70) p[i+3]=Math.min(p[i+3],Math.round((dist-38)/32*255));
        if(p[i+3]>40){const k=i/4,xx=k%w,yy=(k/w)|0; if(xx<minX)minX=xx; if(xx>maxX)maxX=xx; if(yy<minY)minY=yy; if(yy>maxY)maxY=yy}
      }
      if(maxX<0){rej('leer');return}
      x.putImageData(d,0,0);
      const cw=maxX-minX+1,ch=maxY-minY+1,s2=Math.min(1,520/Math.max(cw,ch));
      const c2=document.createElement('canvas'); c2.width=Math.round(cw*s2); c2.height=Math.round(ch*s2);
      c2.getContext('2d').drawImage(c,minX,minY,cw,ch,0,0,c2.width,c2.height);
      URL.revokeObjectURL(url); res(c2.toDataURL('image/png'));
    }catch(e){rej(e)}};
    img.onerror=rej; img.src=url;
  });
}

let pinBuf='', pinStage=null, delArm=null;
function parents(){
  if(!parentOK){
    const setting=!S.pin;
    return `<div class="top"><h2>👪 Elternbereich</h2><button class="iconbtn" data-a="go" data-s="home">✕</button></div>
    <div class="card" style="text-align:center"><h3>${setting?(pinStage?'PIN wiederholen':'Neue 4-stellige PIN festlegen'):'PIN eingeben'}</h3>
      <div class="pin">${[0,1,2,3].map(i=>`<i class="${i<pinBuf.length?'f':''}"></i>`).join('')}</div>
      <div class="keypad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button class="btn" data-a="pin" data-k="${k}">${k}</button>`).join('')}</div></div>`;
  }
  const t=today(), wd=new Date().getDay(); const monday=new Date(); monday.setDate(monday.getDate()-((wd+6)%7));
  let days=''; for(let i=0;i<7;i++){const d=new Date(monday);d.setDate(d.getDate()+i);const k=dkey(d),r=S.days[k];
    days+=`<div class="day ${k===t?'today':''} ${r?.done?'done':''}"><b>${WD[d.getDay()]}</b><span class="ic">${r?.done?'✅':'·'}</span>${r?Math.round(r.mins||0)+' Min':''}${r?.boss?' 👹':''}</div>`}
  const alpha=S.words.filter(w=>w.alpha).sort((a,b)=>(b.wrong||0)-(a.wrong||0));
  const wkSel=P.week||curWeek()?.id; const wk=S.weeks.find(w=>w.id===wkSel); const ww=weekWords(wk);
  return `<div class="top"><h2>👪 Elternbereich</h2><div class="row"><button class="btn" data-a="lock">🔒 Sperren</button><button class="iconbtn" data-a="go" data-s="home">✕</button></div></div>
  <div class="card"><h3>Diese Woche</h3><div class="week">${days}</div>
    <p class="muted small">Lernserie: ${streak()} Schultage · insgesamt ${learnDays()} Lerntage · ${S.defeated} richtige Antworten</p></div>
  <div class="card"><h3>Boss-Kämpfe (Test-Simulation)</h3>
    ${S.bosses.length?`<table><tr><th>Datum</th><th>Punkte</th><th>Note</th><th>Zeit</th></tr>${[...S.bosses].reverse().slice(0,12).map(b=>`<tr><td>${b.date.split('-').reverse().join('.')}</td><td>${fmtPts(b.pts)} / ${b.max}</td><td>${b.grade}</td><td>${Math.floor(b.secs/60)}:${String(b.secs%60).padStart(2,'0')}</td></tr>`).join('')}</table>
    <p class="muted small">Notenschlüssel: ab 92 % Note 1, 81 % Note 2, 67 % Note 3, 50 % Note 4, 30 % Note 5. Die Schule kann anders werten. Bei Note 3 oder schlechter bietet die App am selben oder nächsten Tag eine 5-Minuten-Extra-Mission an.</p>`:'<p class="muted">Noch kein Boss-Kampf.</p>'}</div>
  <div class="card"><h3>Problemwörter (Alpha-Werwölfe)</h3>
    ${alpha.length?`<table><tr><th>Deutsch</th><th>Englisch</th><th>Fehler</th></tr>${alpha.slice(0,30).map(w=>`<tr><td>${esc(w.de)}</td><td>${esc(w.en)}</td><td>${w.wrong||0}</td></tr>`).join('')}</table>`:'<p class="muted">Gerade keine.</p>'}</div>
  <div class="card"><h3>Wortliste bearbeiten</h3>
    ${S.weeks.length?`<select class="edit" id="wksel">${[...S.weeks].reverse().map(w=>`<option value="${w.id}" ${w.id===wkSel?'selected':''}>${esc(region(w).name)} · ab ${w.start.split('-').reverse().join('.')} (${weekWords(w).length} Wörter)</option>`).join('')}</select>`:''}
    <table style="margin-top:8px">${ww.map(w=>`<tr><td><input class="edit" data-ed="de" data-id="${w.id}" value="${esc(w.de)}"></td><td><input class="edit" data-ed="en" data-id="${w.id}" value="${esc(w.en)}"></td><td><button class="btn ${delArm===w.id?'red':''}" data-a="wdel" data-id="${w.id}">${delArm===w.id?'Sicher?':'🗑️'}</button></td></tr>`).join('')}</table>
    <p class="muted small">Mehrere richtige Antworten mit / trennen, z. B. „autumn / fall“. Groß- und Kleinschreibung wird nicht gewertet.</p></div>
  <div class="card"><h3>Einstellungen</h3>
    <div class="grid2"><label>Lange Runde (Di, Do, Fr), Minuten<input class="edit" type="number" min="3" max="30" id="setlong" value="${S.settings.long}"></label>

    <button class="btn" style="margin-top:10px" data-a="newpin">PIN ändern</button></div>
  <div class="card"><h3>Sicherung</h3>
    <p class="muted small">Alle Daten liegen nur auf diesem Gerät. Einmal pro Woche sichern.</p>
    <div class="grid2"><button class="btn primary" data-a="export">💾 Als Datei sichern</button><button class="btn" data-a="copyexp">📋 Text kopieren</button></div>
    <label class="btn" style="width:100%;margin-top:10px">📂 Sicherung laden (Datei)<input type="file" accept=".json,application/json,text/plain" id="impfile" style="display:none"></label>
    <textarea class="edit" id="imptext" style="margin-top:10px" placeholder="…oder Sicherungstext hier einfügen"></textarea>
    <button class="btn" style="margin-top:8px" data-a="imptext">Text laden</button>
    <div id="impconfirm"></div></div>
  <div class="card"><h3>Zurücksetzen</h3><button class="btn ${delArm==='ALL'?'red':''}" data-a="resetall">${delArm==='ALL'?'Wirklich ALLES löschen? Nochmal tippen':'Alles löschen'}</button></div>`;
}
after.parents=()=>{
  if(!parentOK) return;
  $('#wksel')?.addEventListener('change',e=>{P.week=e.target.value;render()});
  app.querySelectorAll('[data-ed]').forEach(inp=>inp.addEventListener('change',e=>{const w=S.words.find(x=>x.id===inp.dataset.id);if(!w)return;const v=inp.value.trim();if(!v){inp.value=w[inp.dataset.ed];return}w[inp.dataset.ed]=v;save();toast('Gespeichert ✓',1200)}));
  $('#setlong').addEventListener('change',e=>{S.settings.long=Math.max(3,Math.min(30,+e.target.value||10));save()});
  $('#setshort').addEventListener('change',e=>{S.settings.short=Math.max(2,Math.min(20,+e.target.value||5));save()});
  $('#impfile').addEventListener('change',async e=>{const f=e.target.files[0];if(f) prepImport(await f.text())});
};
function pinKey(k){
  if(k==='⌫'){pinBuf=pinBuf.slice(0,-1);return render()}
  if(pinBuf.length>=4) return; pinBuf+=k; render();
  if(pinBuf.length<4) return;
  setTimeout(()=>{
    if(!S.pin){
      if(!pinStage){pinStage=pinBuf;pinBuf='';return render()}
      if(pinStage===pinBuf){S.pin=pinBuf;save();parentOK=true;toast('PIN gespeichert')} else toast('Die PINs stimmen nicht überein');
      pinStage=null;pinBuf='';return render();
    }
    if(pinBuf===S.pin){parentOK=true} else toast('Falsche PIN');
    pinBuf=''; render();
  },150);
}
const backupName=()=>`jonnyx-sicherung-${today()}.json`;
function doExport(){
  const data=JSON.stringify(S);
  try{const b=new Blob([data],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=backupName();document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
    S.lastBackup=today();save();toast('Sicherung erstellt. Falls nichts passiert ist: „Text kopieren“ nutzen.')}
  catch(e){toast('Datei-Download geht hier nicht. Bitte „Text kopieren“ nutzen.')}
}
async function copyExport(){
  const data=JSON.stringify(S);
  try{await navigator.clipboard.writeText(data);S.lastBackup=today();save();toast('Kopiert! In eine Notiz oder Mail an dich einfügen.')}
  catch(e){$('#imptext').value=data;toast('Kopieren ging nicht automatisch. Der Text steht unten im Feld: markieren und kopieren.',4000)}
}
let pendingImport=null;
function prepImport(txt){
  try{const s=JSON.parse(txt); if(!s||!Array.isArray(s.words)||!Array.isArray(s.weeks)) throw 0; pendingImport=s;
    $('#impconfirm').innerHTML=`<p>Gefunden: ${s.words.length} Wörter, ${s.weeks.length} Rudel, ${s.teeth} Zähne. Das ersetzt den aktuellen Stand.</p><button class="btn red" data-a="impgo">Ja, Sicherung laden</button>`;
  }catch(e){toast('Das ist keine gültige Sicherung.')}
}

/* ======================= Aktionen ======================= */
function act(a,ds={}){
  switch(a){
    case 'go': if(ds.s==='ritual'){R=null;P={}} go(ds.s); break;
    case 'closego': closeModal(); R=null; go('home'); break;
    case 'mute': S.muted=!S.muted; save(); render(); break;
    case 'hunt': startHunt('normal'); break;
    case 'extra': startHunt('extra'); break;
    case 'boss': startBoss(); break;
    case 'selatt': S.selAttack=ds.id; save(); document.querySelectorAll('.att').forEach(b=>b.classList.toggle('sel',b.dataset.id===ds.id)); break;
    case 'say': speak(ds.t); break;
    // Ritual
    case 'rmode': P.mode=ds.m; P.target=$('#rtarget').value; render(); break;
    case 'rstart': ritualStart(); break;
    case 'radd': ritualAdd(); break;
    case 'rdel': {const i=S.words.findIndex(w=>w.id===ds.id); if(i>=0){S.words.splice(i,1); R.list=R.list.filter(x=>x!==ds.id); R.added=Math.max(0,R.added-1); S.teeth=Math.max(0,S.teeth-1); save(); render()}} break;
    case 'rfinish': ritualFinish(); break;
    // Jagd
    case 'hsubmit': huntSubmit(); break;
    case 'hcopy': huntCopy(); break;
    case 'hnext': huntNext(); break;
    case 'hquit': endHunt('quit'); break;
    // Boss
    case 'breathe': breathe(); break;
    case 'bossgo': closeModal(); go('boss'); break;
    case 'bsubmit': bossSubmit(); break;
    case 'bquit': clearInterval(B?.iv); B=null; go('home'); break;
    // Shop
    case 'tab': P.tab=ds.t; render(); break;
    case 'upg': {const lv=S.attackLv[ds.id]||1,c=UPGRADE_COST[lv]; if(c&&S.teeth>=c){S.teeth-=c;S.attackLv[ds.id]=lv+1;save();sfx.coin();toast('Attacke verstärkt! 💪');render()}} break;
    case 'buy': {const s=suitOf(ds.id); if(S.teeth>=s.cost&&!S.suits.includes(s.id)){S.teeth-=s.cost;S.suits.push(s.id);S.suit=s.id;save();sfx.coin();toast(`${s.name} gekauft!`);render()}} break;
    case 'wear': S.suit=ds.id; save(); render(); break;
    // Held
    case 'herook': if(P.pending){S.hero=P.pending; S.heroFlip=false; P.pending=null; save(); toast('JonnyX ist jetzt dein Held! 🦸'); render()} break;
    case 'heroflip': S.heroFlip=!S.heroFlip; save(); render(); break;
    case 'heroreset': S.hero=null; save(); render(); break;
    // Eltern
    case 'pin': pinKey(ds.k==='⌫'?'⌫':String(ds.k)); break;
    case 'lock': parentOK=false; go('home'); break;
    case 'newpin': S.pin=null; parentOK=false; pinBuf=''; pinStage=null; save(); render(); break;
    case 'wdel': if(delArm===ds.id){S.words=S.words.filter(w=>w.id!==ds.id);delArm=null;save()} else delArm=ds.id; render(); break;
    case 'export': doExport(); break;
    case 'copyexp': copyExport(); break;
    case 'imptext': prepImport($('#imptext').value); break;
    case 'impgo': if(pendingImport){const d=newState(); for(const k in d) if(pendingImport[k]===undefined) pendingImport[k]=d[k]; S=pendingImport; pendingImport=null; save(); toast('Sicherung geladen ✓'); render()} break;
    case 'resetall': if(delArm==='ALL'){const pin=S.pin; S=newState(); S.pin=pin; delArm=null; save(); toast('Alles zurückgesetzt')} else delArm='ALL'; render(); break;
  }
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b||b.disabled) return;
  ac(); if(b.dataset.a!=='wdel'&&b.dataset.a!=='resetall') delArm=null;
  act(b.dataset.a,b.dataset);
});

if('serviceWorker' in navigator && location.protocol==='https:'){
  try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
}
